spring.application.name=program-service
# --- Datasource (PostgreSQL local) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/programdb}
spring.datasource.username=${DB_USERNAME:program_app_rw}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=program
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=program
spring.flyway.default-schema=program
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false

# --- Server ---
server.port=8080


app.notif-daily-utc=00:30

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
